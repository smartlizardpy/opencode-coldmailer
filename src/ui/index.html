<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>coldcall</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%232f6ecf'/><path d='M5 8.5h14M5 12h14M5 15.5h9' stroke='white' stroke-width='2' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/app.css">
<script>
  /* Runs before first paint. Without it, a machine set to dark paints the whole shell dark and
     then flips to light the moment app.js runs - a visible flash on every single navigation.
     Kept inline and tiny for that reason: an external file would be too late. */
  (function () {
    var t = "light";
    try {
      var stored = localStorage.getItem("cc-theme");
      /* An older build wrote "system" here automatically on first load, so a stored "system"
         is not evidence anyone chose it. Treat it as unset and let the default win; a real
         choice of system is re-made with one click. */
      if (stored && stored !== "system") t = stored;
    } catch (e) { /* private mode */ }
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
</head>
<body>
<div id="sprite"></div>

<div class="app" id="app" data-collapsed="0">

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg><use href="#i-send"/></svg>
      </span>
      <span class="brand-name">coldcall</span>
    </div>

    <nav class="nav" id="nav" aria-label="Sections"></nav>

    <div class="sidebar-foot">
      <button class="health-row" id="healthBtn" type="button" title="System status">
        <span class="dot" id="hDot"></span>
        <span class="sidebar-foot-text" id="hText">starting…</span>
      </button>
      <button class="health-row" id="collapseBtn" type="button">
        <svg width="14" height="14" aria-hidden="true"><use href="#i-menu"/></svg>
        <span class="sidebar-foot-text">Collapse</span>
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="topbar-spacer"></div>
      <button class="searchbtn" id="searchBtn" type="button">
        <svg aria-hidden="true"><use href="#i-search"/></svg>
        <span>Search</span><kbd id="kbdHint">⌘K</kbd>
      </button>
      <button class="iconbtn" id="themeBtn" type="button" title="Theme" aria-label="Toggle theme">
        <svg aria-hidden="true"><use href="#i-half-moon"/></svg>
      </button>
    </header>

    <div id="banner" class="banner hidden" role="status"></div>
    <div id="jobbar" class="jobbar hidden" role="status">
      <span class="spinner" aria-hidden="true"></span>
      <span id="jobText"></span>
      <span class="progress hidden" id="jobProgress"><i></i></span>
    </div>

    <main class="content" id="content" tabindex="-1"></main>
  </div>
</div>

<div id="modal"></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script src="/app.js" type="module"></script>
</body>
</html>
